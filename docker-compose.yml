services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeFolio-server
    depends_on:
      - codeFolio-database
    ports:
      - ${SPRING_PORT}:${SPRING_PORT}
    restart: "always"
    networks:
      - codeFolio-bridge

  codeFolio-database:
    image: mysql:8.4.4
    container_name: codeFolio-database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      --port=${DB_PORT} --max_allowed_packet=32M
    expose:
      - ${DB_PORT}
    ports:
      - ${DB_PORT}:${DB_PORT}
    restart: "no"
    volumes:
      - codeFolio-database:/var/lib/mysql
    networks:
      - codeFolio-bridge
volumes:
  codeFolio-database:

networks:
  codeFolio-bridge:
    driver: bridge